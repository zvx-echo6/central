[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "central"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Data hub spine — adapters, bus, archive."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Matt Johnson"}]
dependencies = [
    "aiohttp>=3.13.5",
    "asyncpg>=0.31.0",
    "cloudevents>=2.0.0",
    "cryptography>=44.0.0",
    "nats-py>=2.14.0",
    "pydantic>=2,<3",
    "pydantic-settings>=2.7.0",
    "tenacity>=9.1.4",
]

[project.scripts]
central-supervisor = "central.supervisor:main"
central-archive = "central.archive:main"
central-migrate = "central.migrate:main"
central-cli = "central.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/central"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.13",
]
